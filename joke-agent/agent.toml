schema_version = 1
id = "joke-agent"
name = "Joke Agent"
description = "Returns exactly one clean, prompt-influenced joke; also serves as the built-in live workflow smoke target."
compose_file = "compose.yaml"
project_name = "remoteagent-joke-agent"
runner_service = "agent"
dependency_services = []
enabled = true
config_file = "config.toml"
base_context_file = "AGENTS.md"

[environment]
REMOTEAGENT_AGENT_ID = "joke-agent"
REMOTEAGENT_RESPONSE_CONTRACT = "single-clean-joke"

[labels]
"io.remoteagent.builtin" = "true"
"io.remoteagent.smoke" = "true"

[metadata]
category = "example"
output_contract = "One UTF-8 paragraph beginning with `JOKE: ` and no additional commentary."
supports_artifacts = false

