[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "remoteagent-cron"
version = "0.2.0"
description = "Durable cron scheduler for RemoteAgent MCP agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "croniter>=6.2.4,<7",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=1.12,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
remoteagent-cron = "remoteagent_cron.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/remoteagent_cron"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
